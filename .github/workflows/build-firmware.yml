name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - armsr
          - x86_64
          - rockchip
          - bcm27xx
        default: armsr
      source_repo:
        description: 'OpenWrt source repo'
        required: true
        default: 'https://github.com/coolsnowwolf/lede'
      source_branch:
        description: 'Source branch'
        required: true
        default: 'master'
      toolchain_repo:
        description: 'Toolchain repo (owner/repo)'
        required: true
        default: 'v1nch3r/openwrt-toolchain-builder'
      include_proxy:
        description: 'Include proxy/VPN packages (OpenClash, Passwall)'
        required: true
        type: boolean
        default: true
      upload_release:
        description: 'Upload to GitHub Release?'
        required: true
        type: boolean
        default: true

env:
  TZ: UTC
  BUILD_ROOT: /tmp/openwrt-build

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      # ============================================================
      # Step 1: Free up disk space
      # ============================================================
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/lib/firefox \
            /usr/lib/google-cloud-sdk \
            /usr/local/aws-cli \
            /opt/pipx
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          echo "=== After cleanup ==="
          df -h /

      # ============================================================
      # Step 2: Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev \
            device-tree-compiler libelf-dev libdw-dev \
            qemu-utils ccache

      # ============================================================
      # Step 3: Checkout this repo
      # ============================================================
      - name: Checkout VincherWrt2
        uses: actions/checkout@v4

      # ============================================================
      # Step 4: Clone OpenWrt source
      # ============================================================
      - name: Clone source
        run: |
          echo "=== Cloning OpenWrt source ==="
          mkdir -p ${{ env.BUILD_ROOT }}
          cd ${{ env.BUILD_ROOT }}
          git clone --depth=1 ${{ inputs.source_repo }} -b ${{ inputs.source_branch }} openwrt
          cd openwrt
          echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
          echo "=== Cloned: ${{ inputs.source_repo }} @ ${{ inputs.source_branch }} ==="

      # ============================================================
      # Step 5: Download pre-compiled toolchain
      # ============================================================
      - name: Download toolchain
        run: |
          echo "=== Downloading pre-compiled toolchain ==="
          
          # Find latest toolchain release for target
          TOOLCHAIN_URL=$(curl -s \
            "https://api.github.com/repos/${{ inputs.toolchain_repo }}/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          target = '${{ inputs.target }}'
          for r in releases:
              for a in r.get('assets', []):
                  if target in a['name'] and a['name'].endswith('.tar.gz'):
                      print(a['browser_download_url'])
                      sys.exit(0)
          sys.exit(1)
          ")
          
          if [ -z "$TOOLCHAIN_URL" ]; then
            echo "❌ No toolchain found for target: ${{ inputs.target }}"
            echo "Please build toolchain first at:"
            echo "https://github.com/${{ inputs.toolchain_repo }}/actions"
            exit 1
          fi
          
          echo "Toolchain URL: $TOOLCHAIN_URL"
          cd ${{ env.BUILD_ROOT }}
          
          # Download toolchain
          wget -q "$TOOLCHAIN_URL" -O toolchain-download
          
          # Extract .tar.gz toolchain into staging_dir
          echo "=== Extracting .tar.gz toolchain ==="
          mkdir -p ${{ env.BUILD_ROOT }}/openwrt/staging_dir
          tar -xzf toolchain-download -C ${{ env.BUILD_ROOT }}/openwrt/staging_dir
          
          echo "=== Toolchain extracted ==="
          echo "Contents of staging_dir:"
          ls -la ${{ env.BUILD_ROOT }}/openwrt/staging_dir/
          
          # Verify the correct toolchain is present
          # armsr → aarch64, x86_64 → x86_64, rockchip → aarch64, bcm27xx → aarch64
          TOOLCHAIN_DIR=$(ls ${{ env.BUILD_ROOT }}/openwrt/staging_dir/ | grep toolchain | head -1)
          echo "Toolchain dir: $TOOLCHAIN_DIR"
          
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "❌ No toolchain found in staging_dir after extract!"
            exit 1
          fi
          
          # Check if cross-compiler exists
          CROSS_GCC=$(find ${{ env.BUILD_ROOT }}/openwrt/staging_dir/$TOOLCHAIN_DIR/bin/ -name "*gcc*" | head -1)
          if [ -z "$CROSS_GCC" ]; then
            echo "⚠ No cross-compiler found in $TOOLCHAIN_DIR, build may compile toolchain from source"
          else
            echo "✅ Cross-compiler found: $CROSS_GCC"
          fi

      # ============================================================
      # Step 5: Setup feeds
      # ============================================================
      - name: Setup feeds
        run: |
          cd ${{ env.OPENWRTROOT }}
          chmod +x ${{ github.workspace }}/scripts/setup-feeds.sh
          bash ${{ github.workspace }}/scripts/setup-feeds.sh "$PWD"

      # ============================================================
      # Step 6: Install extra packages
      # ============================================================
      - name: Install extra packages
        if: ${{ inputs.include_proxy }}
        run: |
          cd ${{ env.OPENWRTROOT }}
          chmod +x ${{ github.workspace }}/scripts/install-packages.sh
          bash ${{ github.workspace }}/scripts/install-packages.sh "$PWD"

      # ============================================================
      # Step 7: Copy custom files
      # ============================================================
      - name: Copy custom files
        run: |
          cd ${{ env.OPENWRTROOT }}
          # Create files directory if not exists
          mkdir -p files/etc/uci-defaults files/bin
          # Copy first-boot scripts
          cp -a ${{ github.workspace }}/files/* files/
          chmod +x files/etc/uci-defaults/99-vincherwrt-init
          chmod +x files/bin/vincherwrt-info
          echo "=== Custom files copied ==="
          find files/ -type f

      # ============================================================
      # Step 8: Apply configuration
      # ============================================================
      - name: Configure firmware
        run: |
          cd ${{ env.OPENWRTROOT }}
          
          # Start with target config
          TARGET_CONFIG="${{ github.workspace }}/config/${{ inputs.target }}.conf"
          UNIVERSAL_CONFIG="${{ github.workspace }}/config/universal.conf"
          
          # Merge configs
          cat "$UNIVERSAL_CONFIG" > .config
          echo "" >> .config
          
          # Add target-specific (skip universal include line)
          grep -v "universal.conf" "$TARGET_CONFIG" >> .config || true
          
          # If proxy disabled, remove proxy packages
          if [ "${{ inputs.include_proxy }}" = "false" ]; then
            echo "=== Disabling proxy packages ==="
            sed -i '/openclash\|passwall\|ssr-plus/d' .config || true
          fi
          
          # Pre-enable packages BEFORE oldconfig so kconfig generates sub-package options
          # (e.g. ruby=y makes ruby-yaml, ruby-pstore, ruby-psych appear as options)
          echo "" >> .config
          echo "# Pre-enabled packages (before oldconfig)" >> .config
          for pkg in ruby libruby libgmp openclash luci-app-openclash \
                     passwall luci-app-passwall luci-app-passwall-server \
                     luci-app-modeminfo sing-box xray-core dns2socks tcping \
                     shadowsocks-rust-sslocal shadowsocks-rust-ssserver \
                     shadowsocks-rust-ssmanager shadowsocks-rust-ssservice \
                     shadowsocks-rust-ssurl \
                     shadowsocksr-libev-ssr-redir shadowsocksr-libev-ssr-server \
                     shadowsocksr-libev-ssr-tunnel shadowsocksr-libev-ssr-local \
                     simple-obfs-client simple-obfs-server \
                     chinadns-ng geoview hysteria ipt2socks microsocks \
                     naiveproxy shadow-tls v2ray-geoip v2ray-geosite \
                     v2ray-plugin xray-plugin \
                     kmod-inet-diag kmod-netlink-diag ca-bundle \
                     kmod-nft-tproxy luci-compat; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          
          # Use oldconfig (NOT defconfig — defconfig resets target to x86!)
          yes '' | make oldconfig 2>/dev/null || true
          
          # Force enable ruby sub-packages (generated by oldconfig since ruby=y was pre-enabled)
          for pkg in ruby-yaml ruby-pstore ruby-psych; do
            sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=y/" .config
          done
          
          # Disable Diskman (parted/libparted dependency chain too deep)
          for pkg in luci-app-diskman parted smartmontools dosfstools haproxy; do
            sed -i "s/CONFIG_PACKAGE_${pkg}=y/# CONFIG_PACKAGE_${pkg} is not set/" .config
          done
          sed -i "s/CONFIG_PACKAGE_luci-app-diskman_INCLUDE_btrfs_progs=y/# CONFIG_PACKAGE_luci-app-diskman_INCLUDE_btrfs_progs is not set/" .config
          
          echo "=== Configuration applied ==="
          echo "--- Target check ---"
          grep -E "^CONFIG_TARGET_" .config | head -5
          echo "--- Key packages ---"
          grep -E "openclash|passwall|ruby|sing-box|xray-core|modeminfo|docker" .config | grep "=y" | head -15

      # ============================================================
      # Step 9: Build firmware
      # ============================================================
      - name: Build firmware
        run: |
          cd ${{ env.OPENWRTROOT }}
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "=== Building tools (host) ==="
          make tools/compile -j$(nproc) 2>&1 | tail -30
          TOOLS_EXIT=$?
          if [ $TOOLS_EXIT -ne 0 ]; then
            echo "⚠ Tools build had issues, trying with V=s..."
            make tools/compile -j1 V=s 2>&1 | tail -30
          fi
          
          echo "=== Building kernel ==="
          make target/linux/compile -j$(nproc) 2>&1 | tail -30
          KERNEL_EXIT=$?
          if [ $KERNEL_EXIT -ne 0 ]; then
            echo "❌ Kernel build failed!"
            make target/linux/compile -j1 V=s 2>&1 | tail -50
            exit 1
          fi
          
          echo "=== Building packages ==="
          make package/compile -j$(nproc) 2>&1 | tail -50
          PKG_EXIT=$?
          if [ $PKG_EXIT -ne 0 ]; then
            echo "⚠ Some packages failed, continuing..."
          fi
          
          echo "=== Installing packages (creates rootfs) ==="
          make package/install -j$(nproc) 2>&1 | tail -30
          INSTALL_PKG_EXIT=$?
          if [ $INSTALL_PKG_EXIT -ne 0 ]; then
            echo "❌ Package install failed!"
            make package/install -j1 V=s 2>&1 | tail -50
            exit 1
          fi
          
          echo "=== Building firmware image ==="
          make target/linux/install -j1 2>&1 | tail -50
          INSTALL_EXIT=$?
          if [ $INSTALL_EXIT -ne 0 ]; then
            echo "❌ Image build failed!"
            make target/linux/install -j1 V=s 2>&1 | tail -50
            exit 1
          fi
          
          echo "=== Build complete ==="
          echo "=== Exit codes: tools=$TOOLS_EXIT kernel=$KERNEL_EXIT packages=$PKG_EXIT pkg_install=$INSTALL_PKG_EXIT image=$INSTALL_EXIT ==="

      # ============================================================
      # Step 10: Package output
      # ============================================================
      - name: Package firmware
        run: |
          cd ${{ env.OPENWRTROOT }}
          
          FIRMWARE_DATE=$(date +%Y%m%d)
          FIRMWARE_NAME="vincherwrt-${{ inputs.target }}-$FIRMWARE_DATE"
          echo "FIRMWARE_NAME=$FIRMWARE_NAME" >> $GITHUB_ENV
          echo "FIRMWARE_DATE=$FIRMWARE_DATE" >> $GITHUB_ENV
          
          mkdir -p ${{ github.workspace }}/output
          
          # Find firmware files
          echo "=== Finding firmware files ==="
          find bin/ -type f \( -name "*.img.gz" -o -name "*.tar.gz" -o -name "*.bin" -o -name "*.img" -o -name "*.squashfs" -o -name "*rootfs*" -o -name "*kernel*" \) | head -20
          
          # Show all files in bin/targets
          echo "=== All files in bin/targets ==="
          find bin/targets/ -type f 2>/dev/null | head -30
          
          # Copy firmware files
          find bin/ \( -name "*.img.gz" -o -name "*.tar.gz" -o -name "*.bin" -o -name "*.img" \) \
            -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          
          # Create info file
          cat > ${{ github.workspace }}/output/firmware-info.txt << INFO
          VincherWrt2 Firmware
          ====================
          Target: ${{ inputs.target }}
          Date: $FIRMWARE_DATE
          Source: ${{ inputs.source_repo }} @ ${{ inputs.source_branch }}
          Proxy: ${{ inputs.include_proxy }}
          
          Installation:
          1. Flash .img file to device (dd, balenaEtcher, etc.)
          2. First boot will auto-configure:
             - Hostname: VincherWrt
             - Timezone: Asia/Tokyo
             - WiFi SSID: VincherWrt
             - DNS: 1.1.1.1, 8.8.8.8
          3. Access LuCI at http://192.168.1.1
          INFO
          
          echo "=== Output files ==="
          ls -lh ${{ github.workspace }}/output/

      # ============================================================
      # Step 11: Upload artifacts
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vincherwrt-${{ inputs.target }}
          path: ${{ github.workspace }}/output/
          retention-days: 7

      # ============================================================
      # Step 12: Upload to release
      # ============================================================
      - name: Upload to release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vincherwrt-${{ inputs.target }}-${{ env.FIRMWARE_DATE }}
          name: VincherWrt2 ${{ inputs.target }} (${{ env.FIRMWARE_DATE }})
          body: |
            ## VincherWrt2 Firmware — ${{ inputs.target }}
            
            | Info | Value |
            |------|-------|
            | Target | `${{ inputs.target }}` |
            | Source | `${{ inputs.source_repo }}` |
            | Branch | `${{ inputs.source_branch }}` |
            | Proxy/VPN | ${{ inputs.include_proxy }} |
            | Date | ${{ env.FIRMWARE_DATE }} |
            
            ### First Boot
            - Hostname: `VincherWrt`
            - Timezone: `Asia/Tokyo`
            - WiFi SSID: `VincherWrt`
            - DNS: `1.1.1.1, 8.8.8.8`
            - LuCI: `http://192.168.1.1`
          files: |
            ${{ github.workspace }}/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Step 13: Summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          echo "## 📦 VincherWrt2 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`${{ inputs.target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${{ inputs.source_repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Proxy/VPN | ${{ inputs.include_proxy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ env.FIRMWARE_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY