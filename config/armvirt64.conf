# ARM SystemReady 64-bit (Amlogic S905X via repacker, QEMU, generic ARM64)
# armvirt64 was removed from LEDE, replaced by armsr

CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv8=y

# Partitions
CONFIG_TARGET_KERNEL_PARTSIZE=64
CONFIG_TARGET_ROOTFS_PARTSIZE=1024

# C Library
CONFIG_LIBC_USE_MUSL=y

# Include universal config
$(cat config/universal.conf 2>/dev/null || true)