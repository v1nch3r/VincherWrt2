# ARM Virtual 64-bit (Amlogic S905X/S905X3/S912, QEMU, generic ARM64)
# Uses musl for smaller footprint

CONFIG_TARGET_armvirt=y
CONFIG_TARGET_armvirt_64=y
CONFIG_TARGET_armvirt_64_Default=y

# Partitions
CONFIG_TARGET_KERNEL_PARTSIZE=64
CONFIG_TARGET_ROOTFS_PARTSIZE=1024

# C Library
CONFIG_LIBC_USE_MUSL=y

# Include universal config
$(cat config/universal.conf 2>/dev/null || true)